name: 캘린더 수집

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calendar
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 아이폰 캘린더 → Gist
        env:
          PLANNER_GIST_TOKEN: ${{ secrets.PLANNER_GIST_TOKEN }}
        run: node scripts/fetch-calendar.mjs
      # 공개 저장소는 60일 동안 커밋이 없으면 예약 실행이 멈춘다 → 45일마다 빈 커밋
      - name: 예약 실행 유지
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( ($(date +%s) - last) / 86400 )) -ge 45 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit --allow-empty -m 'chore: 캘린더 예약 실행 유지'
            git push
          fi
