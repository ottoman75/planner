<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>4X 플래너</title>
    <meta name="description" content="시간 단위로 계획하고 실행을 체크하는 데일리 플래너">
    <meta name="theme-color" content="#e9e5df" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#16161a" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="4X 플래너">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page">
        <header class="masthead">
            <div class="date-group">
                <button class="nav-btn" id="prevDay" aria-label="이전 날">‹</button>
                <button class="date-btn" id="dateBtn" aria-label="날짜 선택">
                    <span class="date-text" id="dateText"></span>
                    <span class="weekday" id="weekday"></span>
                </button>
                <button class="nav-btn" id="nextDay" aria-label="다음 날">›</button>
                <input type="date" id="datePicker" class="visually-hidden" tabindex="-1" aria-hidden="true">
            </div>
            <div class="brand-group">
                <button class="chip-btn" id="todayBtn">오늘</button>
                <h1 class="brand" id="brand"></h1>
                <button class="icon-btn" id="settingsBtn" aria-label="설정">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
                </button>
            </div>
        </header>

        <section class="card summary" id="summary" aria-label="오늘 요약"></section>

        <main class="layout">
            <section class="card timetable" aria-label="시간표">
                <div class="cal-allday" id="calAllDay" hidden></div>
                <table class="tt">
                    <colgroup>
                        <col class="c-set"><col class="c-time"><col class="c-cat"><col class="c-action">
                        <col class="c-pri"><col class="c-check"><col class="c-plan">
                    </colgroup>
                    <thead>
                        <tr>
                            <th>SET</th><th>TIME</th><th>분류</th><th>ACTION</th>
                            <th class="th-pri">우선<br>순위</th><th aria-label="완료">✓</th><th>PLAN</th>
                        </tr>
                    </thead>
                    <tbody id="ttBody"></tbody>
                </table>
            </section>

            <aside class="side">
                <section class="card panel" id="fitness" aria-label="피트니스"></section>
                <section class="card panel" id="habits" aria-label="습관"></section>
                <section class="card panel" id="note" aria-label="노트"></section>
            </aside>
        </main>

        <footer class="footer"><span class="rule"></span><span id="footBrand"></span><span class="rule"></span></footer>
    </div>

    <!-- 시간 칸 편집 -->
    <dialog class="sheet" id="rowSheet">
        <form method="dialog" class="sheet-inner" id="rowForm"></form>
    </dialog>

    <!-- 설정 -->
    <dialog class="sheet" id="settingsSheet">
        <form method="dialog" class="sheet-inner" id="settingsForm"></form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="app.js"></script>
</body>
</html>
